<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Gradiente Azul (Mobilidade e Tecnologia) -->
    <linearGradient id="gradLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#3A7BD5" />
    </linearGradient>
    
    <!-- Gradiente Vermelho/Laranja (Alerta/Urgência) -->
    <linearGradient id="gradAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF416C" />
      <stop offset="100%" stop-color="#FF4B2B" />
    </linearGradient>
  </defs>

  <!-- Balão de Chat (Comunicação Anônima) -->
  <path d="M 128 32 C 75 32 32 71 32 120 C 32 142 41 161 56 177 L 44 212 L 83 201 C 97 206 112 208 128 208 C 181 208 224 169 224 120 C 224 71 181 32 128 32 Z" 
        fill="none" stroke="#1E293B" stroke-width="16" stroke-linejoin="round"/>
  
  <!-- Silhueta Aerodinâmica do Carro -->
  <path d="M 72 136 L 86 100 C 90 88 100 80 114 80 L 142 80 C 156 80 166 88 170 100 L 184 136" 
        fill="none" stroke="url(#gradLogo)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Chassi / Base do carro -->
  <path d="M 56 136 L 200 136" 
        fill="none" stroke="url(#gradLogo)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Rodas vazadas (Espaço negativo moderno) -->
  <circle cx="96" cy="136" r="14" fill="#1E293B" />
  <circle cx="160" cy="136" r="14" fill="#1E293B" />
  
  <!-- Ponto de Alerta/Notificação -->
  <circle cx="204" cy="52" r="16" fill="url(#gradAccent)" />
</svg>
